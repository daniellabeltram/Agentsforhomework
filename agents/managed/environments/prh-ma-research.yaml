# Cloud sandbox for the PRH M&A agents.
# Limited networking: web_search / web_fetch and the sandbox can reach only these hosts.
# Add hosts here when the team needs another source, then re-run `ant apply`.
name: prh-ma-research
config:
  type: cloud
  networking:
    type: limited
    allow_package_managers: true
    allowed_hosts:
      - "penguinrandomhouse.com"
      - "*.penguinrandomhouse.com"
      - "prh.com"
      - "*.prh.com"
      - "bertelsmann.com"
      - "*.bertelsmann.com"
      - "publishersweekly.com"
      - "*.publishersweekly.com"
      - "publishingperspectives.com"
      - "*.publishingperspectives.com"
      - "thebookseller.com"
      - "*.thebookseller.com"
      - "publishers.org"
      - "*.publishers.org"
      - "circana.com"
      - "*.circana.com"
      - "janefriedman.com"
      - "booksandpublishing.com.au"
      - "*.booksandpublishing.com.au"
      - "harpercollins.com"
      - "*.harpercollins.com"
      - "hachettebookgroup.com"
      - "*.hachettebookgroup.com"
      - "simonandschuster.com"
      - "*.simonandschuster.com"
      - "us.macmillan.com"
      - "macmillan.com"
      - "newscorp.com"
      - "*.newscorp.com"
      - "kkr.com"
      - "*.kkr.com"
      - "justice.gov"
      - "*.justice.gov"
      - "ftc.gov"
      - "*.ftc.gov"
      - "sec.gov"
      - "*.sec.gov"
      - "copyright.gov"
      - "*.copyright.gov"
      - "irs.gov"
      - "*.irs.gov"
      - "ec.europa.eu"
      - "competition-policy.ec.europa.eu"
      - "gov.uk"
      - "*.gov.uk"
      - "bundeskartellamt.de"
      - "*.bundeskartellamt.de"
      - "accc.gov.au"
      - "*.accc.gov.au"
      - "ifrs.org"
      - "*.ifrs.org"
      - "wikipedia.org"
      - "*.wikipedia.org"
      - "tracxn.com"
      - "*.tracxn.com"
